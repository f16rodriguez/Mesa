# Desplegar Mesa a Cloudflare sin computadora: se corre a mano desde GitHub
# (Actions → Desplegar → Run workflow, también desde la app del teléfono) o desde
# una sesión de Claude. Antes de subir nada pasa la misma puerta que en local:
# reglas, bots, tipos, build, la portada en un navegador de verdad y las pruebas.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   plantilla "Edit Cloudflare Workers" + permiso D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  el id de la cuenta (panel de Cloudflare, a la derecha)
# El id de la base D1 no hace falta: se busca por nombre (mesa-profiles).
# Los secretos de la app (Paddle, LiveKit) viven en Cloudflare, no aquí.
name: Desplegar

on:
  workflow_dispatch:
    inputs:
      sin_pruebas:
        description: 'Saltar las pruebas (solo para una emergencia)'
        type: boolean
        default: false

concurrency:
  group: desplegar-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Dependencias
        run: bun install --frozen-lockfile

      - name: Chromium para la prueba de la portada
        run: bunx playwright install --with-deps chromium

      - name: Build (reglas, bots, tipos, bundle y portada)
        run: bun run build

      - name: Pruebas
        if: ${{ !inputs.sin_pruebas }}
        run: bunx vitest run --pool=threads

      - name: Base D1 de producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en el repositorio."; exit 1; fi
          ID=$(bunx wrangler d1 list --json | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d.get('name')=='mesa-profiles'),''))")
          if [ -z "$ID" ]; then echo "::error::No encontré la base D1 mesa-profiles en esta cuenta."; exit 1; fi
          sed -i "s/PUT-THE-D1-DATABASE-ID-HERE/$ID/" wrangler.cloudflare.jsonc
          echo "Base D1: $ID"

      - name: Desplegar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.cloudflare.jsonc | tee ../despliegue.log

      - name: La mesa responde
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' ../despliegue.log | head -1)
          if [ -z "$URL" ]; then echo "::warning::No vi la dirección en la salida de wrangler."; exit 0; fi
          sleep 5
          curl -fsS -o /dev/null -w "$URL → %{http_code}\n" "$URL/" || echo "::warning::$URL no respondió 200 todavía."
          curl -fsS "$URL/api/pagos" | head -c 200; echo
